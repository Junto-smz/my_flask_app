{% extends "base.html" %}

{% block title %}支出編集{% endblock %}

{% block content %}
    <h2>支出編集</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="return_trip_id" value="{{ return_trip_id }}">
        <div>
            <label for="spent_on">支出日</label>
            <input type="date" id="spent_on" name="spent_on" value="{{ spent_on }}">
        </div>

        <div>
            <label for="trip_id">遠征</label>
            <select id="trip_id" name="trip_id">
                <option value="">未選択</option>
                {% for trip in trips %}
                    <option value="{{ trip.id }}" {% if trip_id == trip.id|string %}selected{% endif %}>
                        {{ trip.match_date }}{{ trip.title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="category">カテゴリ名</label>
            <select id="category" name="category">
                <option value="">選択してください</option>
                {% for category_item in categories %}
                    <option value="{{ category_item }}" {% if category == category_item %}selected{% endif %}>
                        {{ category_item }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="amount">金額</label>
            <input type="number" id="amount" name="amount" value="{{ amount_text }}">
        </div>

        <div>
            <label for="memo">メモ</label>
            <textarea id="memo" name="memo">{{ memo }}</textarea>
        </div>

        <button type="submit">更新</button>
    </form>
    {% if return_trip_id %}
        <a href="{{ url_for('trip_detail', trip_id = return_trip_id) }}">遠征詳細へ戻る</a>
    {% else %}
        <a href="{{ url_for('index') }}">トップページへ戻る</a>
    {% endif %}
{% endblock %}
