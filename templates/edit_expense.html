{% extends "base.html" %}

{% block title %}支出編集{% endblock %}

{% block content %}
    <h2>支出編集</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <div>
            <label for="spent_on">支出日</label>
            <input type="date" id="spent_on" name="spent_on" value="{{ spent_on }}">
        </div>

        <div>
            <label for="category">カテゴリ名</label>
            <select id="category" name="category">
                <option value="">選択してください</option>
                {% for category_item in categories %}
                    <option value="{{ category_item }}" {% if category == category_item %}selected{% endif %}>
                        {{ category_item }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="amount">金額</label>
            <input type="number" id="amount" name="amount" value="{{ amount_text }}">
        </div>

        <div>
            <label for="memo">メモ</label>
            <textarea id="memo" name="memo">{{ memo }}</textarea>
        </div>

        <button type="submit">更新</button>
    </form>
{% endblock %}
