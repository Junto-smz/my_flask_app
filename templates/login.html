{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<h2>ログイン</h2>

<form method="post">
    <label>
        ユーザー名
        <input type="text" name="username">
    </label>

    <label>
        パスワード
        <input type="text" name="password">
    </label>

    <button type="submit">ログイン</button>
</form>

<p>アカウントを持っていない場合は、ユーザー登録をしてください。</p>
{% endblock %}
